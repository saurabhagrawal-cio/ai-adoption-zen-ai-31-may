<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIO Org GenAI Adoption Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

  <!-- Zendesk Official Brand Palette Override & Native Animations -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            starBlink: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.25' },
            }
          },
          animation: {
            'star-blink': 'starBlink 1.5s infinite ease-in-out',
          },
          colors: {
            slate: {
              50: '#f8f9f9',  
              100: '#e9ebed', 
              200: '#d8dcde', 
              400: '#87929d', 
              500: '#68737d', 
              600: '#4f5963', 
              700: '#2f3941', 
              800: '#03363d', 
              900: '#03363d', 
            },
            indigo: {
              50: '#edf6f6',  
              100: '#cce3e3',
              200: '#99c7c7',
              500: '#17494D', 
              600: '#17494D', 
              700: '#03363d', 
              900: '#03363d',
            },
            emerald: {
              50: '#e3faeb',
              100: '#ccebe4',
              600: '#008940', 
              700: '#007033',
            },
            amber: {
              50: '#fff0e1',
              100: '#ffdfc2',
              600: '#d97b16', 
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, Area, ComposedChart, Line } = window.Recharts;

    // =====================================================================
    // SETUP 1: ADOPTION DATA CSV LINK
    // =====================================================================
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9kRs2oPmV1k18EU1imxOUczyf4f_U4vPuT_cSZjTmhO8siOZaKvkhEQ7CPsL7qNR7PVg5I3iFWX-g/pub?gid=2003162137&single=true&output=csv"; 

    // =====================================================================
    // SETUP 2: ZENAI STUDIO WORKFLOWS CSV LINK
    // =====================================================================
    const ZENAI_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSU3AWysjNYJuGJxf6Go0ZiG8Q758r87AudNp9Bmy5mcB5TtTARSO7Zak0TG1AI29TnWHEbKvJkWkQE/pub?gid=0&single=true&output=csv"; 

    // Mock Data for ZenAI Workflows (Used if ZENAI_CSV_URL is empty or fails)
    const MOCK_ZENAI_DATA = [
      { WORKFLOW_NAME: "Slack VDS Reminder Bot", OWNER: "Chaitanya Makashir", DEPARTMENT: "732 IT Customer Experience Systems", STATUS: "Production", TOOL_USED: "LibreChat", IMPACT: "15h/wk", DESCRIPTION: "Configure Slackbot to parse VDS reminder threads daily, capture participant names, and generate automated daily participation report.", PIC_URL: "https://ca.slack-edge.com/E030MJJ0BQF-U07S1HBS0MQ-9d2286daac22-512" },
      { WORKFLOW_NAME: "Code Review & PR Summaries", OWNER: "Alex Chen", DEPARTMENT: "731 Enterprise Data and Analytics", STATUS: "Production", TOOL_USED: "GitHub Copilot", IMPACT: "20h/wk", DESCRIPTION: "Standardized PR review templates and automated docstring generation for all new ETL pipelines, drastically reducing review cycles." },
      { WORKFLOW_NAME: "Vendor Contract Extraction", OWNER: "Priya Patel", DEPARTMENT: "735 Office of the CIO", STATUS: "In Progress", TOOL_USED: "Claude Code", IMPACT: "8h/wk", DESCRIPTION: "Extracting key SLA metrics and renewal dates from unstructured PDF vendor contracts into a structured tracking database." }
    ];

    function App() {
      // Main States
      const [activeTab, setActiveTab] = useState('adoption'); // 'adoption' or 'zenai'
      
      // Adoption Data States
      const [rawData, setRawData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);
      
      // ZenAI Data States
      const [zenaiData, setZenaiData] = useState([]);
      const [zenaiSearch, setZenaiSearch] = useState("");
      
      // Filter States (Adoption)
      const [selectedRegion, setSelectedRegion] = useState('APAC');
      const [selectedCostCenter, setSelectedCostCenter] = useState('All');
      const [selectedTool, setSelectedTool] = useState('ANY_GENAI_TOOL_DAU');
      const [selectedDate, setSelectedDate] = useState('latest');
      const [trendGranularity, setTrendGranularity] = useState('daily');

      // --- Safety Hook for Tabs ---
      useEffect(() => {
        if (selectedRegion !== 'APAC' && activeTab === 'zenai') {
          setActiveTab('adoption');
        }
      }, [selectedRegion, activeTab]);

      // --- Robust Multi-line CSV Parser ---
      const parseCSVToArray = (str) => {
        const arr = [];
        let quote = false;
        let row = 0, col = 0;
        for (let c = 0; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || [];
          arr[row][col] = arr[row][col] || '';
          if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
          if (cc === '"') { quote = !quote; continue; }
          if (cc === ',' && !quote) { ++col; continue; }
          if (cc === '\n' && !quote) { ++row; col = 0; continue; }
          if (cc === '\r' && !quote) { ++row; col = 0; if (nc === '\n') ++c; continue; }
          arr[row][col] += cc;
        }
        return arr;
      };

      // --- Core CSV Parser Function (Adoption) ---
      const parseCSVData = (text) => {
        const dataArr = parseCSVToArray(text.trim().replace(/^\uFEFF/, ''));
        if (dataArr.length < 2) throw new Error("The file appears to be empty.");
        const headers = dataArr[0].map(h => h.trim().replace(/^"|"$/g, ''));
        if (!headers.includes('REPORT_DATE') || !headers.includes('NUMBER_OF_EMPLOYEES')) {
          throw new Error("Invalid CSV format.");
        }
        const requiredColumns = [
          'REPORT_DATE', 'REGION', 'COST_CENTER', 'NUMBER_OF_EMPLOYEES',
          'ANY_GENAI_TOOL_DAU', 'CLAUDE_CODE_DAU', 'LIBRECHAT_DAU', 
          'GITHUB_COPILOT_DAU', 'CURSOR_DAU', 'GEMINI_DAU'
        ];
        return dataArr.slice(1).map(row => {
          const obj = {};
          headers.forEach((h, i) => {
             if (requiredColumns.includes(h)) {
               obj[h] = row[i] ? row[i].trim() : '';
             }
          });
          return obj;
        }).filter(row => row.REPORT_DATE);
      };

      // --- Smart ZenAI CSV Parser (Form-to-Dashboard Mapper) ---
      const parseZenAICSV = (text) => {
        const dataArr = parseCSVToArray(text.trim().replace(/^\uFEFF/, ''));
        if (dataArr.length < 2) return [];
        
        const headers = dataArr[0].map(h => h.trim());
        
        const formatName = (emailStr) => {
          if (!emailStr) return 'Unassigned';
          const namePart = emailStr.split('@')[0];
          return namePart.split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        };

        return dataArr.slice(1).map(row => {
          const obj = {};
          headers.forEach((h, i) => {
            obj[h] = row[i] ? row[i].trim() : '';
          });

          // Fuzzy search to find correct Google Form headers no matter how they change
          const findKey = (searchStr) => Object.keys(obj).find(k => k.toLowerCase().includes(searchStr.toLowerCase()));
          
          return {
            WORKFLOW_NAME: obj[findKey('initiative name')] || '',
            OWNER: formatName(obj[findKey('contact person')] || obj[findKey('owner')]),
            DEPARTMENT: obj[findKey('cio function')] || obj[findKey('department')] || '',
            STATUS: obj[findKey('initiative status')] || obj[findKey('status')] || 'Ideation',
            TOOL_USED: obj[findKey('ai tool')] || obj[findKey('tool used')] || '',
            IMPACT: obj[findKey('reach')] || obj[findKey('outcomes')] || '',
            DESCRIPTION: obj[findKey('problem statement')] || obj[findKey('description')] || '',
            PIC_URL: obj[findKey('profile pic')] || obj[findKey('photo')] || obj[findKey('avatar')] || ''
          };
        }).filter(row => row.WORKFLOW_NAME); // Only keep rows with actual initiative names
      };

      // --- Fetch Data ---
      useEffect(() => {
        // Fetch Adoption Data
        if (CSV_URL) {
          fetch(CSV_URL)
            .then(response => {
              if (!response.ok) throw new Error(`HTTP error!`);
              return response.text();
            })
            .then(text => {
              setRawData(parseCSVData(text));
              setIsLoading(false);
            })
            .catch(err => {
              setError(`Could not load remote CSV.`);
              setIsLoading(false);
            });
        } else {
          setIsLoading(false);
        }

        // Fetch ZenAI Data
        if (ZENAI_CSV_URL) {
          fetch(ZENAI_CSV_URL)
            .then(r => r.text())
            .then(text => setZenaiData(parseZenAICSV(text)))
            .catch(() => setZenaiData(MOCK_ZENAI_DATA));
        } else {
          setZenaiData(MOCK_ZENAI_DATA);
        }
      }, []);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setError(null);
        setIsLoading(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            setRawData(parseCSVData(event.target.result));
            setIsLoading(false);
          } catch (err) {
            setError(err.message);
            setIsLoading(false);
          }
        };
        reader.readAsText(file);
      };

      // --- Shared Constants & Data Processing (Adoption) ---
      const availableDates = useMemo(() => Array.from(new Set(rawData.map(d => d.REPORT_DATE))).sort((a, b) => b.localeCompare(a)), [rawData]);
      const effectiveDate = selectedDate === 'latest' ? availableDates[0] : selectedDate;
      const absoluteLatestDate = availableDates[0];
      const regions = useMemo(() => ['All', ...Array.from(new Set(rawData.map(d => d.REGION).filter(Boolean))).sort()], [rawData]);
      const costCenters = useMemo(() => ['All', ...Array.from(new Set(rawData.map(d => d.COST_CENTER).filter(Boolean))).sort()], [rawData]);

      const regionColors = { 'APAC': '#eab308', 'AMER': '#ef4444', 'EMEA': '#3b82f6', 'LATAM': '#a855f7' };
      const toolOptions = [
        { label: 'Any GenAI Tool', value: 'ANY_GENAI_TOOL_DAU' },
        { label: 'GitHub Copilot', value: 'GITHUB_COPILOT_DAU' },
        { label: 'Claude Code', value: 'CLAUDE_CODE_DAU' },
        { label: 'LibreChat', value: 'LIBRECHAT_DAU' },
        { label: 'Cursor', value: 'CURSOR_DAU' },
        { label: 'Gemini', value: 'GEMINI_DAU' }
      ];

      const filteredData = useMemo(() => rawData.filter(d => (selectedRegion === 'All' || d.REGION === selectedRegion) && (selectedCostCenter === 'All' || d.COST_CENTER === selectedCostCenter)), [rawData, selectedRegion, selectedCostCenter]);
      
      const timeSeriesData = useMemo(() => {
        const dailyMap = {};
        filteredData.forEach(row => {
          const date = row.REPORT_DATE;
          if (!date) return;
          if (!dailyMap[date]) dailyMap[date] = { date, employees: 0, activeUsers: 0 };
          dailyMap[date].employees += Number(row.NUMBER_OF_EMPLOYEES || 0);
          dailyMap[date].activeUsers += Number(row[selectedTool] || 0);
          
          if (row.REGION) {
            const regionKey = `${row.REGION}_users`;
            dailyMap[date][regionKey] = (dailyMap[date][regionKey] || 0) + Number(row[selectedTool] || 0);
          }
        });

        const dailyArr = Object.values(dailyMap).sort((a, b) => a.date.localeCompare(b.date));

        if (trendGranularity === 'daily') {
          return dailyArr.map(d => ({ ...d, label: d.date, adoptionRate: d.employees > 0 ? ((d.activeUsers / d.employees) * 100).toFixed(1) : 0 }));
        } else {
          const weeklyMap = {};
          dailyArr.forEach(d => {
            const [year, month, day] = d.date.split('-');
            const dateObj = new Date(year, month - 1, day);
            const dayOfWeek = dateObj.getDay();
            dateObj.setDate(dateObj.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1));
            const weekStartStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;

            if (!weeklyMap[weekStartStr]) weeklyMap[weekStartStr] = { date: weekStartStr, empSum: 0, auSum: 0, count: 0 };
            weeklyMap[weekStartStr].empSum += d.employees;
            weeklyMap[weekStartStr].auSum += d.activeUsers;
            weeklyMap[weekStartStr].count += 1;
            Object.keys(d).forEach(k => { if (k.endsWith('_users')) weeklyMap[weekStartStr][k] = (weeklyMap[weekStartStr][k] || 0) + d[k]; });
          });
          return Object.values(weeklyMap).sort((a, b) => a.date.localeCompare(b.date)).map(w => {
             const result = { date: w.date, label: `Wk of ${w.date}`, employees: Math.round(w.empSum / w.count), activeUsers: Math.round(w.auSum / w.count), adoptionRate: w.empSum > 0 ? ((w.auSum / w.empSum) * 100).toFixed(1) : 0 };
             Object.keys(w).forEach(k => { if (k.endsWith('_users')) result[k] = Math.round(w[k] / w.count); });
             return result;
          });
        }
      }, [filteredData, selectedTool, trendGranularity]);

      const kpis = useMemo(() => {
        let empCount = 0, auCount = 0;
        filteredData.forEach(row => {
          if (row.REPORT_DATE === effectiveDate) {
            empCount += Number(row.NUMBER_OF_EMPLOYEES || 0);
            auCount += Number(row[selectedTool] || 0);
          }
        });
        return { employees: empCount, activeUsers: auCount, adoptionRate: empCount > 0 ? ((auCount / empCount) * 100).toFixed(1) : 0 };
      }, [filteredData, effectiveDate, selectedTool]);

      const generateDimensionData = (dimensionField) => {
        const map = {};
        filteredData.forEach(row => {
          if (row.REPORT_DATE === effectiveDate) {
            const dimValue = row[dimensionField] || 'Unknown';
            map[dimValue] = (map[dimValue] || 0) + Number(row[selectedTool] || 0);
          }
        });
        return Object.entries(map).map(([name, users]) => ({ name, users })).sort((a, b) => b.users - a.users).slice(0, 10);
      };
      
      const regionBreakdown = useMemo(() => generateDimensionData('REGION'), [filteredData, effectiveDate, selectedTool]);
      const costCenterBreakdown = useMemo(() => generateDimensionData('COST_CENTER'), [filteredData, effectiveDate, selectedTool]);
      const toolBreakdownData = useMemo(() => {
         const totals = { 'GitHub Copilot': 0, 'Claude Code': 0, 'LibreChat': 0, 'Cursor': 0, 'Gemini': 0 };
         filteredData.forEach(row => {
           if (row.REPORT_DATE === effectiveDate) {
             totals['GitHub Copilot'] += Number(row.GITHUB_COPILOT_DAU || 0);
             totals['Claude Code'] += Number(row.CLAUDE_CODE_DAU || 0);
             totals['LibreChat'] += Number(row.LIBRECHAT_DAU || 0);
             totals['Cursor'] += Number(row.CURSOR_DAU || 0);
             totals['Gemini'] += Number(row.GEMINI_DAU || 0);
           }
         });
         return Object.entries(totals).map(([name, users]) => ({ name, users })).sort((a, b) => b.users - a.users);
      }, [filteredData, effectiveDate]);

      const renderCustomDot = (props) => {
        if (selectedRegion !== 'APAC') return null;
        const { cx, cy, payload } = props;
        let milestoneTitle = "";
        
        if (trendGranularity === 'daily') {
          if (payload.date === '2026-01-12') milestoneTitle = 'Leads Forum Setup';
          if (payload.date === '2026-04-06') milestoneTitle = 'ZenAI Studio Kickoff';
          if (payload.date === '2026-05-05') milestoneTitle = 'ZenAI Studio Session 1';
          if (payload.date === '2026-05-14') milestoneTitle = 'ZenAI Studio Session 2';
          if (payload.date === '2026-05-25') milestoneTitle = 'ZenAI Studio Session 3';
        } else {
          if (payload.date === '2026-01-12') milestoneTitle = 'Leads Forum Setup';
          if (payload.date === '2026-04-06') milestoneTitle = 'ZenAI Studio Kickoff';
          if (payload.date === '2026-05-04') milestoneTitle = 'ZenAI Studio Session 1';
          if (payload.date === '2026-05-11') milestoneTitle = 'ZenAI Studio Session 2';
          if (payload.date === '2026-05-25') milestoneTitle = 'ZenAI Studio Session 3';
        }

        if (milestoneTitle) {
          return (
            <g key={`dot-${payload.date}`}>
              <text x={cx} y={cy - 8} textAnchor="middle" fontSize="16" className="fill-red-600 animate-star-blink cursor-help" style={{ display: 'inline-block' }}>
                {'\u2605\uFE0E'}
                <title>{milestoneTitle}</title>
              </text>
            </g>
          );
        }
        return null;
      };

      // --- ZENAI DATA PROCESSING ---
      const filteredZenAIData = useMemo(() => {
        if (!zenaiSearch) return zenaiData;
        const s = zenaiSearch.toLowerCase();
        return zenaiData.filter(w => 
          w.WORKFLOW_NAME?.toLowerCase().includes(s) || 
          w.OWNER?.toLowerCase().includes(s) || 
          w.DEPARTMENT?.toLowerCase().includes(s) ||
          w.TOOL_USED?.toLowerCase().includes(s)
        );
      }, [zenaiData, zenaiSearch]);

      const zenAIStats = useMemo(() => {
        const total = zenaiData.length;
        const deployed = zenaiData.filter(d => {
          const s = (d.STATUS || '').toLowerCase().trim();
          return s === 'deployed' || s === 'production';
        }).length;
        
        const tools = {};
        zenaiData.forEach(d => { if(d.TOOL_USED) tools[d.TOOL_USED] = (tools[d.TOOL_USED]||0) + 1 });
        const topTool = Object.keys(tools).sort((a,b) => tools[b]-tools[a])[0] || 'N/A';
        return { total, deployed, topTool };
      }, [zenaiData]);

      const getStatusColor = (status) => {
        const s = (status || '').toLowerCase().trim();
        if (s === 'production' || s === 'deployed') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
        if (s.includes('in progress')) return 'bg-amber-100 text-amber-700 border-amber-200';
        return 'bg-slate-100 text-slate-700 border-slate-200'; // Default for ideation, backlog etc.
      };


      // --- RENDER HELPERS ---
      if (isLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="flex flex-col items-center">
              <div className="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
              <p className="mt-4 text-slate-500 font-medium">Fetching secure data...</p>
            </div>
          </div>
        );
      }

      if (rawData.length === 0 && activeTab === 'adoption') {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
            <div className="bg-white p-10 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-100">
               <h2 className="text-2xl font-bold text-slate-800 mb-3">Dashboard Setup Required</h2>
               <p className="text-slate-500 mb-8">{error || "No remote CSV URL was found."}</p>
               <label className="flex items-center justify-center w-full bg-slate-100 text-slate-700 py-3 px-4 rounded-xl font-medium cursor-pointer hover:bg-slate-200 transition-colors">
                  Upload Local CSV File
                  <input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
               </label>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-4 md:p-8 pb-24 max-w-7xl mx-auto">
          
          {/* HEADER & NAVIGATION */}
          <div className="mb-6 space-y-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h1 className="text-3xl font-bold text-slate-900 tracking-tight">
                  {selectedRegion === 'APAC' ? 'CIO India Operational AI Adoption Insights' : 'CIO Org Operational AI Adoption Insights'}
                </h1>
                {selectedRegion === 'APAC' ? (
                  <p className="text-indigo-700 font-bold mt-1.5 flex items-center text-[14px] tracking-wide">
                    <span className="animate-star-blink text-red-600 text-lg mr-1.5 inline-block leading-none">{'\u2605\uFE0E'}</span>
                    ZenAI Studio Enablement Program
                  </p>
                ) : (
                  <p className="text-slate-500 font-bold mt-1.5 text-[13px] uppercase tracking-wider">Global Executive Dashboard</p>
                )}
              </div>
              
              <div className="flex items-center space-x-3 bg-white p-2 rounded-lg shadow-sm border border-slate-200">
                <div className="flex items-center text-xs text-emerald-600 font-medium px-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                  Live Data Connected
                </div>
              </div>
            </div>

            {/* TAB NAVIGATION */}
            <div className="flex p-1 bg-slate-200/50 rounded-xl w-fit border border-slate-200">
              <button 
                onClick={() => setActiveTab('adoption')}
                className={`px-5 py-2.5 text-sm font-bold rounded-lg transition-all ${activeTab === 'adoption' ? 'bg-white text-indigo-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                Adoption Metrics
              </button>
              {selectedRegion === 'APAC' && (
                <button 
                  onClick={() => setActiveTab('zenai')}
                  className={`px-5 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center gap-2 ${activeTab === 'zenai' ? 'bg-white text-indigo-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  <span className={activeTab === 'zenai' ? 'text-red-600 animate-star-blink' : 'text-slate-400'}>{'\u2605\uFE0E'}</span>
                  ZenAI Studio Workflows
                </button>
              )}
            </div>
          </div>

          {/* ========================================================= */}
          {/* VIEW 1: ADOPTION METRICS (Existing Dashboard)               */}
          {/* ========================================================= */}
          {activeTab === 'adoption' && (
            <div className="space-y-6 animate-fade-in">
              {/* Global Filters */}
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4">
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Region</label>
                  <select className="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 transition-all outline-none" value={selectedRegion} onChange={e => setSelectedRegion(e.target.value)}>
                    {regions.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Cost Center</label>
                  <select className="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 transition-all outline-none" value={selectedCostCenter} onChange={e => setSelectedCostCenter(e.target.value)}>
                    {costCenters.map(cc => <option key={cc} value={cc}>{cc}</option>)}
                  </select>
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">GenAI Tool</label>
                  <select className="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 transition-all outline-none" value={selectedTool} onChange={e => setSelectedTool(e.target.value)}>
                    {toolOptions.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                  </select>
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Report Date</label>
                  <input type="date" className="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 transition-all outline-none" value={selectedDate === 'latest' ? absoluteLatestDate || '' : selectedDate} min={availableDates.length > 0 ? availableDates[availableDates.length - 1] : ''} max={absoluteLatestDate || ''} onChange={e => setSelectedDate(e.target.value)} />
                </div>
              </div>

              {/* KPI Metrics */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center">
                  <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Daily Active Users</p>
                  <h2 className="text-4xl font-black text-indigo-600">{kpis.activeUsers.toLocaleString()}</h2>
                  <p className="text-xs text-slate-400 mt-2">For {selectedTool.replace('_DAU', '').replace(/_/g, ' ')}</p>
                </div>
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center">
                  <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Target Audience Size</p>
                  <h2 className="text-4xl font-black text-slate-800">{kpis.employees.toLocaleString()}</h2>
                  <p className="text-xs text-slate-400 mt-2">Total Employees in selected group</p>
                </div>
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-6 opacity-10">
                    <svg className="w-16 h-16 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
                  </div>
                  <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Adoption Rate</p>
                  <h2 className="text-4xl font-black text-emerald-600">{kpis.adoptionRate}%</h2>
                  <p className="text-xs text-slate-400 mt-2">% of Audience active daily</p>
                </div>
              </div>

              {/* Main Charts */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 lg:col-span-2 flex flex-col">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                    <div>
                      <h3 className="text-lg font-bold text-slate-800">Adoption Trend (DAU over Time)</h3>
                      {selectedRegion === 'All' && (
                        <div className="flex flex-wrap items-center gap-3 mt-1.5">
                          <div className="flex items-center gap-1.5 text-[11px] font-medium text-slate-600"><span className="w-3 h-0.5 bg-[#17494D] rounded"></span> Overall</div>
                          {regions.filter(r => r !== 'All').map(r => <div key={r} className="flex items-center gap-1.5 text-[11px] text-slate-500"><span className="w-3 h-0.5 rounded" style={{ backgroundColor: regionColors[r] || '#94a3b8' }}></span> {r}</div>)}
                        </div>
                      )}
                    </div>
                    <div className="flex flex-col items-end gap-2">
                      <div className="flex bg-slate-100 p-1 rounded-lg">
                        <button onClick={() => setTrendGranularity('daily')} className={`px-3 py-1 text-xs font-medium rounded-md transition-colors ${trendGranularity === 'daily' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Daily</button>
                        <button onClick={() => setTrendGranularity('weekly')} className={`px-3 py-1 text-xs font-medium rounded-md transition-colors ${trendGranularity === 'weekly' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Weekly</button>
                      </div>
                      {selectedRegion === 'APAC' && (
                        <div className="flex flex-col items-end mr-1">
                          <div className="flex items-center gap-1 text-[12px] font-bold text-slate-700 tracking-wide">ZenAI Studio <span className="animate-star-blink text-sm text-red-600 inline-block leading-none pb-0.5 ml-1">{'\u2605\uFE0E'}</span></div>
                          <div className="text-[10px] text-slate-500 max-w-[300px] text-right leading-tight mt-1">CIO-India grassroots AI enablement program</div>
                          <div className="text-[9px] text-slate-400 italic mt-0.5">(Hover over stars for details)</div>
                        </div>
                      )}
                    </div>
                  </div>
                  
                  <div className="h-72 w-full flex-grow">
                    <ResponsiveContainer width="100%" height="100%">
                      <ComposedChart data={timeSeriesData} margin={{ top: 30, right: 10, left: -20, bottom: 0 }}>
                        <defs>
                          <linearGradient id="colorUsers" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor="#17494D" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#17494D" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e9ebed" />
                        <XAxis dataKey="label" tick={{fontSize: 12, fill: '#68737d'}} tickMargin={10} minTickGap={30} />
                        <YAxis tick={{fontSize: 12, fill: '#68737d'}} />
                        <RechartsTooltip contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} labelStyle={{ fontWeight: 'bold', color: '#03363d', marginBottom: '4px' }} />
                        <Area type="monotone" dataKey="activeUsers" stroke="#17494D" strokeWidth={selectedRegion === 'All' ? 2 : 3} fillOpacity={1} fill="url(#colorUsers)" name="Overall Active Users" dot={renderCustomDot} activeDot={{ r: 6, fill: '#03363d', stroke: '#fff', strokeWidth: 2 }} />
                        {selectedRegion === 'All' && regions.filter(r => r !== 'All').map(r => <Line key={r} type="monotone" dataKey={`${r}_users`} name={`${r} Users`} stroke={regionColors[r] || '#94a3b8'} strokeWidth={2} dot={false} activeDot={{ r: 4 }} />)}
                      </ComposedChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="flex flex-col gap-6">
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex-1">
                    <h3 className="text-lg font-bold text-slate-800 mb-4">Users by Tool</h3>
                    <div className="h-48">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={toolBreakdownData} layout="vertical" margin={{ top: 0, right: 20, left: 10, bottom: 0 }}>
                          <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#e9ebed" />
                          <XAxis type="number" hide />
                          <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#68737d'}} width={100} />
                          <RechartsTooltip cursor={{fill: '#f8f9f9'}} contentStyle={{ borderRadius: '8px' }} />
                          <Bar dataKey="users" fill="#008940" radius={[0, 4, 4, 0]} barSize={20} name="Active Users" />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                  
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex-1">
                    <h3 className="text-lg font-bold text-slate-800 mb-4">Adoption by Region</h3>
                    <div className="h-48">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={regionBreakdown} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e9ebed" />
                          <XAxis dataKey="name" tick={{fontSize: 12, fill: '#68737d'}} tickLine={false} axisLine={false} tickMargin={10} />
                          <YAxis tick={{fontSize: 12, fill: '#68737d'}} tickLine={false} axisLine={false} />
                          <RechartsTooltip cursor={{fill: '#f8f9f9'}} contentStyle={{ borderRadius: '8px' }} />
                          <Bar dataKey="users" fill="#03363d" radius={[4, 4, 0, 0]} maxBarSize={40} name="Active Users" />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 lg:col-span-3">
                  <h3 className="text-lg font-bold text-slate-800 mb-4">Adoption by Cost Center</h3>
                  <div className="h-64">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={costCenterBreakdown} layout="vertical" margin={{ top: 0, right: 20, left: 20, bottom: 0 }}>
                        <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#e9ebed" />
                        <XAxis type="number" hide />
                        <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#68737d'}} width={250} />
                        <RechartsTooltip cursor={{fill: '#f8f9f9'}} contentStyle={{ borderRadius: '8px' }} />
                        <Bar dataKey="users" fill="#d97b16" radius={[0, 4, 4, 0]} barSize={20} name="Active Users" />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>
            </div>
          )}


          {/* ========================================================= */}
          {/* VIEW 2: ZENAI STUDIO WORKFLOWS                            */}
          {/* ========================================================= */}
          {activeTab === 'zenai' && (
            <div className="space-y-6 animate-fade-in">
              
              {/* ZenAI KPIs & Search */}
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center">
                    <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Workflows</p>
                    <h2 className="text-4xl font-black text-indigo-900">{zenAIStats.total}</h2>
                    <p className="text-xs text-slate-400 mt-2">Active initiatives in ZenAI Studio</p>
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center relative overflow-hidden">
                     <div className="absolute top-0 right-0 p-6 opacity-10">
                        <svg className="w-16 h-16 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </div>
                    <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Deployed</p>
                    <h2 className="text-4xl font-black text-emerald-600">{zenAIStats.deployed}</h2>
                    <p className="text-xs text-slate-400 mt-2">Successfully rolled out to production</p>
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center">
                    <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Top Tool Utilized</p>
                    <h2 className="text-3xl font-black text-amber-600 mt-1 truncate">{zenAIStats.topTool}</h2>
                    <p className="text-xs text-slate-400 mt-2">Most frequent engine in workflows</p>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Search Workflows</label>
                  <div className="relative">
                    <svg className="w-5 h-5 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input 
                      type="text" 
                      placeholder="Search by owner, tool, or name..." 
                      className="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg pl-10 pr-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                      value={zenaiSearch}
                      onChange={(e) => setZenaiSearch(e.target.value)}
                    />
                  </div>
                </div>

              </div>

              {/* ZenAI Workflow Cards Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                {filteredZenAIData.length > 0 ? filteredZenAIData.map((wf, idx) => (
                  <div key={idx} className="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-6 flex flex-col h-full relative overflow-hidden group">
                    
                    {/* Status Badge */}
                    <div className="flex justify-between items-start mb-4">
                      <span className={`px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border ${getStatusColor(wf.STATUS)}`}>
                        {wf.STATUS || 'Unknown'}
                      </span>
                      {wf.TOOL_USED && (
                        <span className="text-[11px] font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">
                          {wf.TOOL_USED}
                        </span>
                      )}
                    </div>
                    
                    {/* Core Info */}
                    <h3 className="text-lg font-bold text-slate-900 leading-tight mb-2 group-hover:text-indigo-700 transition-colors">{wf.WORKFLOW_NAME}</h3>
                    <p className="text-sm text-slate-600 mb-6 whitespace-pre-wrap flex-grow line-clamp-4 group-hover:line-clamp-none transition-all">{wf.DESCRIPTION}</p>
                    
                    {/* Meta Footer */}
                    <div className="pt-4 border-t border-slate-100 mt-auto">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm overflow-hidden shrink-0 border border-indigo-200">
                            {wf.PIC_URL ? (
                              <img 
                                src={wf.PIC_URL} 
                                alt={wf.OWNER} 
                                className="w-full h-full object-cover" 
                                onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} 
                              />
                            ) : null}
                            <span style={{ display: wf.PIC_URL ? 'none' : 'block' }}>
                              {wf.OWNER ? wf.OWNER.charAt(0) : '?'}
                            </span>
                          </div>
                          <div>
                            <p className="text-xs font-bold text-slate-800">{wf.OWNER || 'Unassigned'}</p>
                            <p className="text-[10px] text-slate-500 truncate max-w-[120px]" title={wf.DEPARTMENT}>{wf.DEPARTMENT}</p>
                          </div>
                        </div>
                        {wf.IMPACT && (
                          <div className="text-right">
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Est. Impact</p>
                            <p className="text-xs font-bold text-slate-700 max-w-[100px] truncate" title={wf.IMPACT}>{wf.IMPACT}</p>
                          </div>
                        )}
                      </div>
                    </div>

                  </div>
                )) : (
                  <div className="col-span-full bg-white rounded-xl border border-slate-200 p-12 text-center">
                    <p className="text-slate-500 font-medium">No workflows found matching your search.</p>
                  </div>
                )}
              </div>

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</body>
</html>
